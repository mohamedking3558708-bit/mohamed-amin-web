<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Reviews | Mohamed Amin</title>
<meta name="description" content="Client feedback and reviews for Mohamed Amin, Video Editor | Reels & YouTube.">
<meta property="og:type" content="website"><meta property="og:title" content="Client Reviews | Mohamed Amin"><meta property="og:description" content="See what previous clients say about working with me."><meta property="og:image" content="https://mohamed-amin.pages.dev/og-image.png"><meta property="og:url" content="https://mohamed-amin.pages.dev/reviews.html">
<link rel="icon" type="image/png" href="logo-M.A02%20(1).png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#08070c;--white:#f7f4fb;--muted:#b8afc1;--purple:#a855f7;--pink:#e879f9;--line:#ffffff18}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 0,rgba(82,34,111,.24),transparent 42%),var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.13;background-image:radial-gradient(rgba(255,255,255,.4) .78px,transparent .82px);background-size:5px 5px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
a{color:inherit}.shell{width:min(1500px,calc(100% - clamp(24px,4vw,72px)));margin:0 auto;position:relative;z-index:1}
nav{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff10;gap:18px}.brand{display:flex;align-items:center;min-width:0}.brand img{width:auto;max-width:165px;height:auto;max-height:42px;object-fit:contain}.nav-links{display:flex;align-items:center;gap:clamp(12px,2vw,25px)}.nav-links a,.lang{font:600 12px Inter,Arial,sans-serif;color:#bcb3c7;text-decoration:none;background:none;border:0;cursor:pointer;white-space:nowrap}.nav-links a:hover,.nav-links a.active{color:#fff}.lang{border:1px solid #ffffff24;background:#17121f;color:#f5eaff;border-radius:20px;padding:8px 12px}
.page-head{padding:clamp(42px,7vw,82px) 0 28px;text-align:center}.eyebrow{font-size:10px;letter-spacing:.2em;color:#c6a4ee;margin-bottom:11px}.page-head h1{font-size:clamp(34px,5vw,58px);line-height:1.15;margin:0 0 14px;font-weight:800;letter-spacing:-.03em}.page-head p{font-size:clamp(13px,1.2vw,16px);line-height:1.9;color:var(--muted);max-width:650px;margin:0 auto}.rule{height:2px;width:84px;margin:22px auto 0;background:linear-gradient(90deg,var(--purple),var(--pink));border:0;border-radius:2px}
.gallery{columns:4;column-gap:18px}.review-tile{display:block;position:relative;width:100%;break-inside:avoid;margin:0 0 18px;padding:7px;border:1px solid #ffffff17;border-radius:15px;background:linear-gradient(145deg,#1b1723,#100e15);box-shadow:0 8px 28px #0004;cursor:zoom-in;text-align:inherit;overflow:hidden;transition:border-color .22s,transform .22s,box-shadow .22s;font:inherit;color:inherit}.review-tile:hover{border-color:#c084fc88;transform:translateY(-3px);box-shadow:0 14px 34px #0007,0 0 20px #a855f71c}.review-tile img{display:block;width:100%;height:auto;max-width:100%;object-fit:contain;border-radius:9px;background:#0c0a10}.tile-open-label{position:absolute;inset:auto 14px 14px 14px;padding:9px 12px;border:1px solid #ffffff2a;border-radius:9px;background:rgba(18,13,26,.88);backdrop-filter:blur(10px);font-size:11px;text-align:center;opacity:0;transform:translateY(5px);transition:opacity .2s,transform .2s;pointer-events:none}.review-tile:hover .tile-open-label,.review-tile:focus-visible .tile-open-label{opacity:1;transform:translateY(0)}.gallery-empty{margin:24px auto 60px;padding:26px;border:1px solid var(--line);border-radius:14px;text-align:center;max-width:650px;color:#b8afc1;background:#17131d}
.text-heading{font-size:22px;margin:48px 0 16px}.text-reviews{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:65px}.quote-card{border:1px solid var(--line);border-radius:15px;padding:22px;background:linear-gradient(145deg,#1c1724,#100e15)}.quote-mark{font-size:36px;line-height:1;color:#c084fc}.quote-card h3{font-size:13px;margin:10px 0}.quote-card p{font-size:12px;color:#c4bbce;line-height:1.9;white-space:pre-wrap;margin:0}.footer{border-top:1px solid #ffffff10;padding:24px 0 30px;text-align:center;color:#7f758b;font-size:10px;letter-spacing:.04em}
.modal{position:fixed;inset:0;z-index:20;background:rgba(4,3,7,.9);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:22px;overflow:auto}.modal.open{display:flex}.modal-box{width:min(1050px,100%);max-height:calc(100vh - 44px);overflow:auto;display:flex;flex-direction:column;align-items:center;gap:15px;position:relative;padding:10px 10px 20px;border:1px solid #ffffff1c;border-radius:16px;background:linear-gradient(145deg,#1d1727,#0f0d13);box-shadow:0 25px 90px #000a}.close{align-self:flex-end;width:40px;height:40px;border:1px solid #ffffff26;border-radius:50%;background:#201929;color:white;font-size:27px;line-height:1;cursor:pointer}.modal-image{display:block;width:auto;height:auto;max-width:min(88vw,950px);max-height:69vh;object-fit:contain;border-radius:8px}.modal-details{text-align:center;max-width:760px;padding:0 14px}.modal-details h2{font-size:16px;line-height:1.6;margin:0 0 5px}.modal-details p{font-size:12px;color:#c4bbce;line-height:1.9;white-space:pre-wrap;margin:0}.status{color:#b8afc1;text-align:center;padding:30px 10px}
.arabic{font-family:'IBM Plex Sans Arabic',Arial,sans-serif}.arabic .nav-links a,.arabic .lang{font-family:'IBM Plex Sans Arabic',Arial,sans-serif}.arabic .page-head h1,.arabic .text-heading{letter-spacing:0}.arabic .page-head p,.arabic .quote-card p{line-height:2}
@media(max-width:1150px){.gallery{columns:3}.text-reviews{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.shell{width:calc(100% - 28px)}nav{height:68px}.brand img{max-width:125px;max-height:34px}.nav-links{gap:10px}.nav-links a{font-size:10px}.nav-links a:nth-child(2){display:none}.page-head{padding:42px 0 25px}.page-head h1{font-size:clamp(31px,8vw,42px)}.gallery{columns:2;column-gap:12px}.review-tile{margin-bottom:12px;padding:5px;border-radius:12px}.tile-open-label{inset:auto 9px 9px 9px;padding:7px 8px;font-size:10px}.text-reviews{grid-template-columns:1fr;gap:12px}.text-heading{margin-top:36px;font-size:20px}.modal{padding:8px}.modal-box{max-height:calc(100vh - 16px);padding:7px}.modal-image{max-width:91vw;max-height:68vh}}
@media(max-width:420px){.gallery{columns:1}.nav-links a:nth-child(1){display:none}.brand img{max-width:112px}.lang{padding:7px 9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<nav><a class="brand" href="index.html" aria-label="Home"><img src="logo-M.A01.png" alt="Mohamed Amin"></a><div class="nav-links"><a href="index.html" data-en="Home" data-ar="الرئيسية">Home</a><a href="work.html" data-en="My Work" data-ar="أعمالي">My Work</a><a class="active" href="reviews.html" data-en="Reviews" data-ar="آراء العملاء">Reviews</a><a href="index.html#contact" data-en="Contact" data-ar="تواصل">Contact</a><button class="lang" id="langToggle" type="button">العربية</button></div></nav>
<header class="page-head"><div class="eyebrow" data-en="CLIENT EXPERIENCES" data-ar="تجارب العملاء">CLIENT EXPERIENCES</div><h1 data-en="Client Reviews" data-ar="آراء العملاء">Client Reviews</h1><p data-en="See what previous clients say about working with me." data-ar="شاهد آراء عملائنا السابقين وتجاربهم في العمل معي.">See what previous clients say about working with me.</p><hr class="rule"></header>
<main><div id="imageReviews" class="gallery" aria-live="polite"><div class="status">Loading reviews…</div></div><section id="textReviewSection" hidden><h2 class="text-heading" data-en="Written Reviews" data-ar="آراء مكتوبة">Written Reviews</h2><div id="textReviews" class="text-reviews"></div></section></main>
<footer class="footer">© <span id="year"></span> Mohamed Amin · Video Editor</footer>
</div>
<div id="reviewModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true"><div class="modal-box"><button class="close" type="button" aria-label="Close">×</button><img class="modal-image" alt="" hidden><div class="modal-details"><h2></h2><p></p></div></div></div>
<script>
(()=>{
 const $=s=>document.querySelector(s);
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const arabicCountries=new Set(['DZ','BH','KM','DJ','EG','IQ','JO','KW','LB','LY','MR','MA','OM','PS','QA','SA','SO','SD','SY','TN','AE','YE']);
 const languageKey='mohamedAminLanguagePreference';
 function setLanguage(lang){const ar=lang==='ar';document.documentElement.lang=lang;document.documentElement.dir=ar?'rtl':'ltr';document.body.classList.toggle('arabic',ar);document.querySelectorAll('[data-en][data-ar]').forEach(el=>el.innerHTML=ar?el.dataset.ar:el.dataset.en);$('#langToggle').textContent=ar?'English':'العربية';try{localStorage.setItem(languageKey,lang)}catch{}}
 async function initialLanguage(){let lang='';try{lang=localStorage.getItem(languageKey)||''}catch{}if(!['ar','en'].includes(lang)){try{const response=await fetch('https://ipapi.co/json/',{cache:'no-store'});const geo=await response.json();lang=arabicCountries.has(String(geo.country_code||'').toUpperCase())?'ar':'en'}catch{lang=(navigator.language||'').toLowerCase().startsWith('ar')?'ar':'en'}}setLanguage(lang||'en')}
 const modal=$('#reviewModal');const modalImg=modal.querySelector('.modal-image');
 function openReview(review){modalImg.hidden=!review.imageUrl;modalImg.src=review.imageUrl||'';modalImg.alt=review.clientName||review.label||'Client review';modal.querySelector('.modal-details h2').textContent=review.clientName||review.label||(document.documentElement.lang==='en'?'Client review':'رأي عميل');modal.querySelector('.modal-details p').textContent=review.detail||review.content||'';modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
 function closeModal(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');modalImg.src='';document.body.style.overflow=''}
 modal.querySelector('.close').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
 function render(data){const all=(data.reviews||[]).filter(r=>r.visible!==false);const images=all.filter(r=>r.mode==='image'&&r.imageUrl);const written=all.filter(r=>r.mode!=='image'&&(r.content||r.detail));const gallery=$('#imageReviews');if(images.length){gallery.style.display='block';gallery.innerHTML=images.map((r,i)=>`<button class="review-tile" type="button" data-review-index="${i}" aria-label="${esc(r.clientName||r.label||(document.documentElement.lang==='en'?`Client review ${i+1}`:`رأي العميل ${i+1}`))}"><img src="${esc(r.imageUrl)}" alt="${esc(r.clientName||r.label||'Client review')}" loading="lazy"><span class="tile-open-label">${document.documentElement.lang==='en'?'Click to view details':'اضغط لعرض التفاصيل'}</span></button>`).join('');gallery.querySelectorAll('[data-review-index]').forEach(btn=>btn.addEventListener('click',()=>openReview(images[Number(btn.dataset.reviewIndex)])))}else if(written.length){gallery.style.display='none';gallery.innerHTML=''}else{gallery.style.display='block';gallery.innerHTML=`<div class="gallery-empty" style="column-span:all">${document.documentElement.lang==='ar'?'لا توجد آراء منشورة حتى الآن. ستظهر هنا الآراء التي تُضاف من لوحة التحكم.':'No client reviews have been published yet. Add reviews from the admin panel and they will appear here.'}</div>`}
 const section=$('#textReviewSection'),root=$('#textReviews');if(written.length){section.hidden=false;root.innerHTML=written.map((r,i)=>`<article class="quote-card"><div class="quote-mark">“</div><h3>${esc(r.clientName||(document.documentElement.lang==='en'?`Client ${i+1}`:`عميل ${i+1}`))}</h3><p>${esc(r.content||r.detail||'')}</p></article>`).join('')}else section.hidden=true;}
 async function init(){await initialLanguage();$('#year').textContent=new Date().getFullYear();try{const response=await fetch(`portfolio-data.json?v=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error('No data');const data=await response.json();render(data)}catch{render({reviews:[]})}}
 $('#langToggle').addEventListener('click',()=>setLanguage(document.documentElement.lang==='en'?'ar':'en'));
 init();
})();
</script>
</body>
</html>
